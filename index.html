async function showDiag(app){
  showPane("diag");
  $("#diagPane").innerHTML = `<div class="empty"><span class="spinner"></span><br>`
    + `reading events and pod logs for ${escapeHtml(label(app))}…</div>`;
  try{
    const r = await fetch("/api/diag?app=" + encodeURIComponent(app));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    renderDiag(d);
  }catch(e){ $("#diagPane").innerHTML = `<div class="empty">${escapeHtml(e.message || e)}</div>`; }
}
function renderDiag(d){
  const head = `<div class="dg-head"><span class="dg-app">${escapeHtml(label(d.app))}</span>`
    + `<span class="pill ${d.health === "Healthy" ? "success" : "failure"}">${escapeHtml(d.health || "?")}</span>`
    + `<span class="ci-repo">${escapeHtml(d.sync || "")}</span>`
    + `<button class="btn" id="diagAsk" data-app="${escapeHtml(d.app)}">ask claude</button>`
    + `<button class="btn" id="diagBack">all unhealthy</button></div>`;
  const conds = (d.conditions || []).map(c =>
    `<div class="dg-ev Warning"><span class="r">${escapeHtml(c.type)}</span>`
    + `<span class="m">${escapeHtml(c.message)}</span></div>`).join("");
  const pods = (d.pods || []).map(p => {
    const ev = (p.events || []).map(e =>
      `<div class="dg-ev ${escapeHtml(e.type)}"><span class="r">${escapeHtml(e.reason)}`
      + (e.count > 1 ? ` ×${escapeHtml(e.count)}` : "") + `</span>`
      + `<span class="m">${escapeHtml(e.message)}</span>`
      + `<span class="age">${escapeHtml(ago(e.at))}</span></div>`).join("");
    const kind = p.kind && p.kind !== "Pod" ? `<span class="ci-repo">${escapeHtml(p.kind)}</span> ` : "";
    return `<div class="dg-pod"><div class="dg-name">${kind}${escapeHtml(p.name)}</div>`
      + `<div class="dg-info"><span>${escapeHtml(p.status)}</span>`
      + (p.info || []).map(i => `<span>${escapeHtml(i)}</span>`).join("")
      + `<span>${escapeHtml(p.namespace)}</span></div>`
      + (p.message ? `<div class="dg-msg">${escapeHtml(p.message)}</div>` : "")
      + (ev ? `<div class="dg-sub">events</div>${ev}` : "")
      + (p.log ? `<div class="dg-sub">log \u00b7 ${escapeHtml(p.logContainer || "")}`
                 + `${p.logPrevious ? " (the container that died)" : ""}</div>`
                 + `<pre class="dg-log">${escapeHtml(p.log)}</pre>`
         : p.kind === "Pod" ? `<div class="dg-info">no log kept for this pod</div>` : "")
      + `</div>`;
  }).join("");
  $("#diagPane").innerHTML = head
    + (conds ? `<div class="dg-sub">app conditions</div>${conds}` : "")
    + (pods ? `<div class="dg-sub">unhealthy resources${d.podCount > (d.pods || []).length
        ? ` (showing ${d.pods.length} of ${d.podCount})` : ""}</div>${pods}`
      : `<div class="empty">Nothing unhealthy in the resource tree right now.</div>`);
  $("#diagBack").onclick = () => showHealth();
}

// ---- GitHub Actions, via the gh CLI on the server: no OAuth app, no secret on disk ----
async function loadRepos(){
  try{
    const r = await fetch("/api/repos"); const d = await r.json();
    if(d.error) throw new Error(d.error);
    state.repos = d;
  }catch(e){ state.repos = {org:"", map:{}, repos:[], suggested:{}, error:e.message||String(e)}; }
}
async function saveRepoMap(app, repo){
  const d = await post("/api/repos", {app, repo});   // server merges: no read-modify-write race
  if(d.map) state.repos.map = d.map;
  loadCi([app]);                                     // only the card that changed
}
// `gh run list` costs a round trip per repo, so a card refresh only asks for the cards that
// changed and the rest keep showing what they already had.
async function loadCi(apps){
  const want = (apps || [...state.selected]).filter(a => state.selected.has(a));
  if(!want.length){ renderCi(); return; }
  if(!state.repos.repos || !state.repos.repos.length) await loadRepos();
  want.forEach(a => state.ciBusy.add(a));
  renderCi();
  try{
    const r = await fetch("/api/ci?apps=" + encodeURIComponent(want.join(",")));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    (d.ci || []).forEach(c => state.ci[c.app] = c);
  }catch(e){
    want.forEach(a => state.ci[a] = {app:a, repo:"", error:e.message || String(e)});
  }finally{
    want.forEach(a => state.ciBusy.delete(a));
    renderCi();
  }
}
function ago2(iso){ return ago(iso) ? ago(iso) + " ago" : ""; }
// Three destinations, because they answer three different questions: the PR shows the review and
// the whole diff, the commit shows what actually landed, the run shows why CI is red.
function prLink(r, repo){
  const sha = r.headSha || "";
  if(r.pr) return `<a class="btn" href="https://github.com/${gh(repo)}/pull/${escapeHtml(r.pr)}"`
    + ` target="_blank" rel="noreferrer" title="Open the pull request and its diff">PR #${escapeHtml(r.pr)}</a>`;
  return `<button class="btn" data-pr="${escapeHtml(sha)}" data-repo="${escapeHtml(repo)}"`
    + ` title="This commit is not a squash merge — ask GitHub which PR it came from">find PR</button>`;
}
function gh(repo){ return escapeHtml(state.repos.org + "/" + repo); }
function runLine(r, repo){
  const st = r.conclusion || r.status || "";
  const sha = (r.headSha || "");
  return `<span class="pill ${escapeHtml(st)}">${escapeHtml(st)}</span>`
    + `<a class="ci-sha" href="https://github.com/${gh(repo)}/commit/${escapeHtml(sha)}"`
    + ` target="_blank" rel="noreferrer" title="Open this commit's diff">${escapeHtml(sha.slice(0,8))}</a>`
    + `<span class="ci-title">${escapeHtml(r.displayTitle || "")}</span>`
    + `<span class="age">${escapeHtml(ago2(r.createdAt))}</span>`
    + prLink(r, repo)
    + `<a class="btn" href="${escapeHtml(r.url)}" target="_blank" rel="noreferrer" title="Open this run on GitHub">run</a>`
    + `<button class="btn" data-rerun="${escapeHtml(r.databaseId)}" data-repo="${escapeHtml(repo)}"`
    + ` data-wf="${escapeHtml(r.workflowName || "")}" title="Re-run every job of this run on GitHub">rerun</button>`;
}
function repoPicker(app){
  const sug = state.repos.suggested[app] || "";
  const opts = ['<option value="">— no repo —</option>'].concat(
    (state.repos.repos || []).map(r =>
      `<option value="${escapeHtml(r)}"${r === sug ? " data-sug=\"1\"" : ""}>${escapeHtml(r)}${r === sug ? " (suggested)" : ""}</option>`));
  return `<div class="ci-pick"><label>repo <select data-app="${escapeHtml(app)}">${opts.join("")}</select></label>`
    + (sug ? `<button class="btn" data-accept="${escapeHtml(app)}" data-repo="${escapeHtml(sug)}">use ${escapeHtml(sug)}</button>` : "")
    + `</div>`;
}
function workloadBlock(c){
  const w = c.workload;
  if(!w || !w.path) return "";
  const open = (w.open || []).map(p =>
    `<div class="ci-wf"><span class="name"><span class="pill in_progress">open</span></span>`
    + `<a class="ci-sha" href="${escapeHtml(p.url)}" target="_blank" rel="noreferrer">#${escapeHtml(p.number)}</a>`
    + `<span class="ci-title">${escapeHtml(p.title || "")}</span>`
    + `<span class="age">${escapeHtml(ago2(p.at))}</span></div>`).join("");
  // the bot pushes image bumps straight to the branch, so a landed change without a PR is the
  // truth rather than a lookup that failed — no button to click and find that out
  const landed = (w.commits || []).map(x =>
    `<div class="ci-wf"><span class="name">${escapeHtml(ago2(x.date))}</span>`
    + `<a class="ci-sha" href="${escapeHtml(x.url)}" target="_blank" rel="noreferrer"`
    + ` title="Open this workload change">${escapeHtml(x.sha.slice(0,8))}</a>`
    + `<span class="ci-title">${escapeHtml(x.title || "")}</span>`
    + (x.pr ? `<a class="btn" href="${escapeHtml(x.prUrl)}" target="_blank" rel="noreferrer">PR #${escapeHtml(x.pr)}</a>`
            : `<span class="ci-repo">pushed</span>`) + `</div>`).join("");
  return `<div class="ci-wl"><a class="ci-repo" href="${escapeHtml(w.url)}" target="_blank" rel="noreferrer"`
    + ` title="Open this service's directory in ${escapeHtml(w.repo)}">workload: ${escapeHtml(w.path)} \u2197</a>`
    + (open ? `<div class="dg-sub">open pull requests</div>${open}` : "")
    + (landed ? `<div class="dg-sub">landed</div>${landed}`
              : `<div class="ci-repo">no workload change yet</div>`) + `</div>`;
}
function renderCi(){
  const el = $("#ciPane");
  if(!state.selected.size){
    el.innerHTML = '<div class="empty">Tick services on the left to see their pipelines.</div>';
    return;
  }
  if(state.repos.error){ el.innerHTML = `<div class="empty">gh unavailable: ${escapeHtml(state.repos.error)}</div>`; return; }
  const apps = [...state.selected].sort((a,b) => label(a).localeCompare(label(b)));
  el.innerHTML = apps.map(app => {
    const c = state.ci[app] || {app, repo:"", workflows:[]};
    const busy = state.ciBusy.has(app);
    const head = `<div class="ci-head"><span class="ci-app">${escapeHtml(label(app))}</span>`
      + (busy ? '<span class="spinner"></span>' : "")
      + (c.repo ? `<a class="ci-repo" href="${escapeHtml(c.url || "")}" target="_blank" rel="noreferrer"`
                  + ` title="Open the Actions tab of this repo">${escapeHtml(c.repo)} \u2197</a>`
                  + `<span class="ci-repo">${escapeHtml(c.branch || "main")} only</span>`
                  + `<button class="btn" data-accept="${escapeHtml(app)}" data-repo="">unlink</button>`
                : repoPicker(app)) + `</div>`;
    const body = c.error ? `<div class="ci-broke">${escapeHtml(c.error)}</div>` : c.repo
      ? ((c.workflows || []).length ? c.workflows.map(w =>
            `<div class="ci-wf"><span class="name" title="${escapeHtml(w.workflow)}">${escapeHtml(w.workflow)}</span>${runLine(w.latest, c.repo.split("/")[1])}</div>`
            + (w.broke ? `<div class="ci-broke">broke at <a class="ci-sha" href="https://github.com/${gh(c.repo.split("/")[1])}/commit/${escapeHtml(w.broke.headSha)}" target="_blank" rel="noreferrer">${escapeHtml(w.broke.headSha.slice(0,8))}</a> `
                 + `${escapeHtml(w.broke.displayTitle || "")} `
                 + prLink(w.broke, c.repo.split("/")[1]) + " "
                 + `<button class="btn" data-log="${escapeHtml(w.broke.databaseId)}" data-repo="${escapeHtml(c.repo.split("/")[1])}">failed log</button></div>` : "")
          ).join("") : `<div class="ci-repo">${busy ? "loading…" : "no workflow runs"}</div>`)
      : "";
    return `<div class="ci-card" data-app="${escapeHtml(app)}">${head}${body}${workloadBlock(c)}</div>`;
  }).join("");
}
$("#ciPane").addEventListener("change", e => {
  const sel = e.target.closest("select[data-app]");
  if(sel) saveRepoMap(sel.dataset.app, sel.value);
});
$("#ciPane").addEventListener("click", async e => {
  const acc = e.target.closest("button[data-accept]");
  if(acc){ saveRepoMap(acc.dataset.accept, acc.dataset.repo); return; }
  const rr = e.target.closest("button[data-rerun]");
  if(rr){
    const repo = rr.dataset.repo, run = rr.dataset.rerun;
    const ok = await askConfirm({title:"Re-run pipeline",
      what:"Starts every job of this run again on GitHub Actions. These workflows deploy, "
           + "so a re-run deploys that environment again.",
      apps:[`${repo} · ${rr.dataset.wf} · run ${run}`], challenge:""});
    if(!ok) return;
    flashBtn(rr, "…");
    const d = await post("/api/ci-rerun", {repo, run});
    flashBtn(rr, d.ok ? "queued" : "failed");
    const app = rr.closest(".ci-card").dataset.app;
    if(d.ok) setTimeout(() => loadCi([app]), 4000);   // GitHub needs a moment to register the run
    return;
  }
  const pr = e.target.closest("button[data-pr]");
  if(pr){
    flashBtn(pr, "…");
    try{
      const r = await fetch(`/api/pr?repo=${encodeURIComponent(pr.dataset.repo)}&sha=${encodeURIComponent(pr.dataset.pr)}`);
      const d = await r.json();
      if(d.pr){
        const a = document.createElement("a");
        a.className = "btn"; a.target = "_blank"; a.rel = "noreferrer";
        a.href = `https://github.com/${state.repos.org}/${pr.dataset.repo}/pull/${d.pr}`;
        a.textContent = "PR #" + d.pr;
        pr.replaceWith(a);
      }else{ flashBtn(pr, "no PR"); }
    }catch(err){ flashBtn(pr, "failed"); }
    return;
  }
  const lg = e.target.closest("button[data-log]");
  if(!lg) return;
  const box = document.createElement("pre"); box.className = "ci-log"; box.textContent = "loading…";
  lg.closest(".ci-card").append(box);
  try{
    const r = await fetch(`/api/ci-log?repo=${encodeURIComponent(lg.dataset.repo)}&run=${encodeURIComponent(lg.dataset.log)}`);
    const d = await r.json();
    box.textContent = d.log || d.error || "no log";
  }catch(err){ box.textContent = "failed: " + (err.message || err); }
});

// ---- copy ----
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(_){
    // clipboard API needs a secure context — falls back when opened over plain http on a LAN IP
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.cssText = "position:fixed;top:-9999px";
    document.body.append(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  }
}
function flashBtn(btn, txt){
  if(btn._restore) clearTimeout(btn._restore); else btn._label = btn.textContent;
  btn.textContent = txt;
  btn._restore = setTimeout(() => { btn.textContent = btn._label; btn._restore = 0; }, 1200);
}
// ---- ask claude: what is wrong with this service ----
// Two entry points, one endpoint. The health tab knows an app and lets the server fetch the
// diagnosis; the logs pane knows what is on screen and sends that.
async function askClaude(btn, apps, lines){
  if(!apps.length){ flashBtn(btn, "pick a service"); return; }
  const dlg = $("#ask");
  $("#askTitle").firstChild.textContent = "What is wrong";
  $("#askSrc").textContent = apps.length === 1 ? label(apps[0]) : apps.length + " services";
  $("#askBody").innerHTML = '<span class="spinner"></span> reading…';
  if(!dlg.open) dlg.showModal();
  try{
    const d = await post("/api/analyze", {apps, lines});
    if(d.error) throw new Error(d.error);
    $("#askBody").textContent = d.text || "(no answer)";
    const read = [d.repo, d.workload && "deploy manifests"].filter(Boolean);
    if(read.length) $("#askSrc").textContent += " · read " + read.join(" + ");
  }catch(e){
    $("#askBody").textContent = "failed: " + (e.message || e);
  }
}
$("#askClose").onclick = () => $("#ask").close();
$("#askCopy").onclick = async e => flashBtn(e.currentTarget,
  await copyText($("#askBody").textContent) ? "copied" : "copy failed");
$("#askLogs").onclick = e =>
  askClaude(e.currentTarget, [...state.selected], state.buf.filter(rowVisible).map(o => o.line));
$("#diagPane").addEventListener("click", e => {
  const btn = e.target.closest("#diagAsk");
  if(btn) askClaude(btn, [btn.dataset.app], []);
});

$("#copy").onclick = async e => {
  const btn = e.currentTarget;
  const lines = state.buf.filter(rowVisible).map(o => o.line);
  if(!lines.length){ flashBtn(btn, "nothing"); return; }
  flashBtn(btn, await copyText(lines.join("\n")) ? `copied ${lines.length}` : "copy failed");
};
$("#pane").addEventListener("dblclick", async e => {
  const row = e.target.closest(".row");
  if(!row || !row._o) return;
  if(!await copyText(row._o.line)) return;
  getSelection().removeAllRanges();  // dblclick selects the word under the cursor; drop it
  row.classList.add("copied");
  setTimeout(() => row.classList.remove("copied"), 700);
});

// click traceId → filter to that trace
$("#pane").addEventListener("click", e => {
  const t = e.target.closest(".trace"); if(!t) return;
  $("#grep").value = t.dataset.t; state.grep = t.dataset.t.toLowerCase(); applyFilter();
});
</script>
